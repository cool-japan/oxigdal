[package]
name = "my-oxigeo-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
oxigeo-core = "0.2"
oxigeo-server = "0.2"
oxigeo-geotiff = "0.2"

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
