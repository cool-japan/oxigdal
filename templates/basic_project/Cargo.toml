[package]
name = "my-oxigeo-project"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
oxigeo-core = "0.2"
oxigeo-algorithms = "0.2"
oxigeo-geotiff = "0.2"
oxigeo-geojson = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Async runtime (optional)
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
async = ["tokio"]
