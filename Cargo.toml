# Paths intentionally excluded from workspace resolution: each is a standalone
# Cargo project (project template or vendored crate) without its own
# [workspace] table, so cargo would otherwise error with "current package
# believes it's in a workspace when it's not" when resolved on its own
# (e.g. `cargo metadata --manifest-path templates/basic_project/Cargo.toml`).
exclude = [
    "templates/basic_project",
    "templates/cli_tool",
    "templates/ml_project",
    "templates/server_project",
    "vendor/pathfinder_simd",
]

