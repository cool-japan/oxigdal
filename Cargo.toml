oxigdal-security = { path = "crates/oxigdal-security", version = "0.1.7", default-features = false }
oxigdal-ha = { path = "crates/oxigdal-ha", version = "0.1.7" }
oxigdal-gateway = { path = "crates/oxigdal-gateway", version = "0.1.7" }
oxigdal-workflow = { path = "crates/oxigdal-workflow", version = "0.1.7" }
oxigdal-cloud-enhanced = { path = "crates/oxigdal-cloud-enhanced", version = "0.1.7" }
oxigdal-db-connectors = { path = "crates/oxigdal-db-connectors", version = "0.1.7" }
oxigdal-drivers-advanced = { path = "crates/oxigdal-drivers-advanced", version = "0.1.7" }
oxigdal-jupyter = { path = "crates/oxigdal-jupyter", version = "0.1.7" }
oxigdal-dev-tools = { path = "crates/oxigdal-dev-tools", version = "0.1.7" }
oxigdal-kinesis = { path = "crates/oxigdal-kinesis", version = "0.1.7" }
oxigdal-mqtt = { path = "crates/oxigdal-mqtt", version = "0.1.7" }
oxigdal-pubsub = { path = "crates/oxigdal-pubsub", version = "0.1.7" }
oxigdal-streaming = { path = "crates/oxigdal-streaming", version = "0.1.7" }
oxigdal-kafka = { path = "crates/oxigdal-kafka", version = "0.1.7" }
oxigdal-mobile-enhanced = { path = "crates/oxigdal-mobile-enhanced", version = "0.1.7" }
oxigdal-pwa = { path = "crates/oxigdal-pwa", version = "0.1.7" }
oxigdal-sync = { path = "crates/oxigdal-sync", version = "0.1.7" }
