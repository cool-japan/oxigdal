[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.95"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxigdal"
homepage = "https://github.com/cool-japan/oxigdal"
documentation = "https://docs.rs/oxigdal"
readme = "README.md"

[workspace.dependencies]
# Core dependencies
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
byteorder = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "macros", "serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Arrow ecosystem
arrow = { version = "59", default-features = false }
arrow-array = "59"
arrow-buffer = "59"
arrow-ipc = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false }

# Compression - COOLJAPAN Pure Rust Policy (oxiarc ecosystem)
# Use oxiarc-* crates instead of C-based compression libraries
# Updated to 0.2.8: rs3gw 0.2.1 requires oxiarc-deflate/lz4 ^0.2.8 which in turn
# needs oxiarc-core 0.2.8 for OutputRingBuffer::{ring_snapshot,drain_output,restore_ring}
oxiarc-archive = "0.3.6"  # ZIP, TAR, GZIP, LZH, XZ archive formats
oxiarc-core = "0.3.6"     # Core components for OxiArc
oxiarc-deflate = "0.3.6"  # Pure Rust DEFLATE (replacement for flate2)
oxiarc-lzw = "0.3.6"      # Pure Rust LZW compression
oxiarc-lz4 = "0.3.6"      # Pure Rust LZ4 compression
oxiarc-zstd = "0.3.6"     # Pure Rust Zstandard compression
oxiarc-bzip2 = "0.3.6"    # Pure Rust BZip2 compression
oxiarc-lzhuf = "0.3.6"    # Pure Rust LZH compression
oxiarc-snappy = "0.3.6"   # Pure Rust Snappy compression (replacement for snap)
oxiarc-brotli = "0.3.6"   # Pure Rust Brotli compression (replacement for brotli)

jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
image-webp = "0.2"

# Serialization formats
apache-avro = { version = "0.21", default-features = false }
flatbuffers = "25"
rmp-serde = "1.3"
toml = "1.1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }

# Storage backend
rs3gw = { version = "0.2.2", default-features = false }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "console",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
    "Response",
    "Headers",
    "RequestInit",
    "Request",
    "RequestMode",
    "Worker",
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
    "Blob",
    "BlobPropertyBag",
    "Url",
    # IndexedDB features
    "IdbDatabase",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    "IdbIndex",
    "IdbTransactionMode",
    "IdbRequestReadyState",
    "DomException",
    "Event",
    "EventTarget",
] }

# COOLJAPAN ecosystem
scirs2-core = "0.6.1"
# numrs2 = { version = "0.1", optional = true }
# oxiblas = { version = "0.1", optional = true }
oxicode = "0.2.4"
oxih5 = "0.2.0"
oxinetcdf = "0.2.0"

# OxiProj — Pure-Rust cartographic library (COOLJAPAN)
# `epsg` is deliberately NOT enabled at the workspace level: it pulls `oxiproj-db`
# (tokio/std, not wasm-safe). oxigdal-proj (the only consumer) opts into it via its
# own `proj-db` feature; the default/wasm build uses `projjson` + the pure-Rust
# `from_proj`/`Transformer::new` path instead.
oxiproj = { version = "0.1.2", default-features = false, features = ["projjson"] }
oxiproj-core = { version = "0.1.2", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1"
tokio-test = "0.4"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }
pprof = { version = "0.15", default-features = false, features = ["flamegraph", "prost-codec"] }

# Memory-mapped I/O
memmap2 = "0.9"

# Additional dependencies
num-traits = "0.2"
once_cell = "1"
approx = "0.5"
rayon = "1"
clap_mangen = "0.3"
clap_complete_nushell = "4.6"
# lz4 replaced by oxiarc-lz4 (Pure Rust)
lru = "0.18"
tempfile = "3"
quick-xml = "0.41"
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
dashmap = "6"
ordered-float = "5.3"
sysinfo = "0.39"
tinytemplate = "1"

# Cloud storage
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x", "default-https-client"] }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Messaging
rdkafka = { version = "0.39", default-features = false, features = ["tokio"] }
rumqttc = { version = "0.25", default-features = false }
# NOTE: sled 0.34.7 has unmaintained deps (RUSTSEC-2025-0057 fxhash, RUSTSEC-2024-0384 instant)
# Low risk: optional features, stable code. Consider redb for future major version.
sled = "0.34"

# Pure-Rust SQLite engine (COOLJAPAN noffi ecosystem)
oxisql-core = "0.4.0"
oxisql-sqlite-compat = { version = "0.4.0", features = ["blocking"] }

# Scheduling
cron = "0.17"

# Async caching
moka = { version = "0.12", features = ["future"] }

# Pattern matching
regex = "1"

# Random number generation
fastrand = "2"

# WASM utilities
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

# Internal crates - core
oxigdal-core = { path = "crates/oxigdal-core", version = "0.1.7" }
# default-features = false so wasm consumers can select the lean `std`-only surface
# (Cargo hard-errors on member-level `default-features = false` otherwise).
# Native consumers re-enable defaults with `default-features = true` in their manifests.
oxigdal-algorithms = { path = "crates/oxigdal-algorithms", version = "0.1.7", default-features = false }
oxigdal-proj = { path = "crates/oxigdal-proj", version = "0.1.7" }
oxigdal-qc = { path = "crates/oxigdal-qc", version = "0.1.7" }

# Driver crates
oxigdal-geotiff = { path = "crates/oxigdal-drivers/geotiff", version = "0.1.7" }
oxigdal-geojson = { path = "crates/oxigdal-drivers/geojson", version = "0.1.7" }
oxigdal-geojson-stream = { path = "crates/oxigdal-geojson", version = "0.1.7" }
oxigdal-zarr = { path = "crates/oxigdal-drivers/zarr", version = "0.1.7" }
oxigdal-flatgeobuf = { path = "crates/oxigdal-drivers/flatgeobuf", version = "0.1.7" }
oxigdal-shapefile = { path = "crates/oxigdal-drivers/shapefile", version = "0.1.7" }
oxigdal-netcdf = { path = "crates/oxigdal-drivers/netcdf", version = "0.1.7" }
oxigdal-geoparquet = { path = "crates/oxigdal-drivers/geoparquet", version = "0.1.7" }
oxigdal-hdf5 = { path = "crates/oxigdal-drivers/hdf5", version = "0.1.7" }
oxigdal-vrt = { path = "crates/oxigdal-drivers/vrt", version = "0.1.7" }
oxigdal-grib = { path = "crates/oxigdal-drivers/grib", version = "0.1.7" }
oxigdal-jpeg2000 = { path = "crates/oxigdal-drivers/jpeg2000", version = "0.1.7" }

# Feature-specific crates
oxigdal-wasm = { path = "crates/oxigdal-wasm", version = "0.1.7" }
oxigdal-wasm-geoparquet = { path = "crates/oxigdal-wasm-geoparquet", version = "0.1.7" }
oxigdal-mobile = { path = "crates/oxigdal-mobile", version = "0.1.7" }
oxigdal-cloud = { path = "crates/oxigdal-cloud", version = "0.1.7" }
oxigdal-3d = { path = "crates/oxigdal-3d", version = "0.1.7" }
