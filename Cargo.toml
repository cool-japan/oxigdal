oxigdal-terrain = { path = "crates/oxigdal-terrain", version = "0.1.7" }
oxigdal-rs3gw = { path = "crates/oxigdal-rs3gw", version = "0.1.7" }
oxigdal-distributed = { path = "crates/oxigdal-distributed", version = "0.1.7" }
