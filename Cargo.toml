# Node.js bindings dependencies
napi = "3"
napi-derive = "3"
napi-build = "2"

# Build tools / code generators
cbindgen = "0.29"

# Connection pooling
bb8 = "0.9"
deadpool = "0.13"

# WKB/WKT serialization
wkt = "0.14"

# CRC hashing
crc32fast = "1"

# SQL parsing
sqlparser = "0.62"

# Embedded-specific dependencies
critical-section = "1"
portable-atomic = "1"
heapless = "0.9"
embedded-hal = "1"
libm = "0.2"

# Hostname
hostname = "0.4"

# Geodesic computations (Pure Rust)
geographiclib-rs = "0.2"

# URL and GeoJSON support
url = { version = "2", features = ["serde"] }
geojson = "1.0"
geo-types = "0.7"
geo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }

# Web framework dependencies (for oxigdal-server)
axum = "0.8"
tower = { version = "0.5", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors", "compression-br", "compression-gzip", "compression-deflate"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18"

# CLI and config
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "cargo"] }
clap_complete = "4"

# GPU compute
encase = "0.12"
glam = { version = "0.33", features = ["bytemuck"] }
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal"] }

# 3D/Point cloud
gltf = { version = "1", features = ["import"] }
gltf-json = "1"
delaunator = "1"
rstar = "0.13"
las = "0.9"
laz = { version = "0.12", default-features = false }
base64 = "0.22"

# Crypto (for optional features)
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", features = ["hmac"] }
argon2 = "0.5"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
# ed25519-dalek internally uses sha2 0.10 (accepted duplicate major vs workspace sha2 0.11).
# No `asm`/`fast` features: `fast` only adds big basepoint tables we don't need.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
webpki-roots = "1.0"

# OxiTLS — pure-Rust TLS stack
oxitls-core = "0.2.1"
oxitls-adapter-rustls-rustcrypto = { version = "0.2.1", default-features = false }
oxitls-webpki-roots = "0.2.1"

# OAuth2
oauth2 = { version = "5", default-features = false }

# Cloud providers (Azure, GCS)
# Azure SDK kept at 0.21 (API stability, latest available for storage crates)
azure_storage = "0.21"
azure_storage_blobs = "0.21"
azure_storage_datalake = "0.21"
azure_core = "1.0"
azure_identity = "1.0"
# Google Cloud SDK - using latest stable versions (reduces tonic/axum duplication)
google-cloud-storage = "1"  # Upgraded from 0.22
google-cloud-auth = "1"     # Upgraded from 0.18
google-cloud-gax = "1"      # Paginator traits (ItemPaginator) for gcs feature
google-cloud-bigquery = "0.15"
google-cloud-pubsub = "1.1"  # Upgraded from 0.29 to use latest tonic/axum

# AWS extended SDK
aws-sdk-athena = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-types = { version = "1", features = ["byte-stream-poll-next"] }
aws-sdk-glue = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sagemaker = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sagemakerruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-cloudwatch = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-costexplorer = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-kinesis = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-firehose = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-kinesisanalyticsv2 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }

# Scientific computing
# scirs2-core already defined above in COOLJAPAN ecosystem section
oxionnx = { version = "0.1.4", features = ["ndarray"] }
ndarray = "0.17"

# Python bindings
numpy = "0.29"
pyo3-build-config = "0.29"

# SciRS2 AI/ML subcrates - Pure Rust (COOLJAPAN compliant)
scirs2-neural = "0.6.1"
scirs2-autograd = "0.6.1"
scirs2-optimize = "0.6.1"
scirs2-datasets = "0.6.1"
scirs2-metrics = "0.6.1"
scirs2-linalg = "0.6.1"
scirs2-vision = "0.6.1"
scirs2-series = "0.6.1"

# PostgreSQL
tokio-postgres = "0.7"
postgres-types = "0.2"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.14"

# Distributed computing
arrow-flight = "59"
tonic = "0.14"
prost = "0.14"
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
blake3 = "1"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
ahash = { version = "0.8", features = ["serde"] }

# ML dependencies
aws-credential-types = "1"

# Observability (OpenTelemetry ecosystem)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-stdout = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics", "trace", "grpc-tonic"] }
tracing-opentelemetry = "0.33"
prometheus = "0.14"
statrs = "0.18"

# Gateway dependencies
async-graphql = "7"
async-graphql-axum = "7"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2"  # RUSTSEC-2025-0134: Unmaintained (archived Aug 2025). Waiting for upstream (tonic, rumqttc) to migrate to rustls-pki-types 1.9+
tokio-tungstenite = "0.29"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
governor = "0.10"

# Workflow dependencies
petgraph = "0.8"
num_cpus = "1"
pest = "2"
pest_derive = "2"

# Jupyter and dev tools dependencies
jupyter = "0.2"
# NOTE: evcxr 0.18 uses json 0.12.4 (RUSTSEC-2022-0081: unmaintained). Low risk: dev tool only.
evcxr = "0.21"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "image", "all_series", "all_elements"] }
plotters-backend = "0.3"
# indicatif 0.18 replaced number_prefix with unit-prefix (resolves RUSTSEC-2025-0119)
indicatif = "0.18"
console = "0.16"
comfy-table = "7"
colored = "3"
walkdir = "2"
notify = "8"
diff = "0.1"

# Projection libraries
proj4rs = "0.1"
proj = { version = "0.31", default-features = false }

# Python bindings runtime
pyo3 = { version = "0.29", default-features = false }

# NetCDF-3 Pure Rust
netcdf3 = "0.6"

# State backend (OxiStore LSM via fjall — Pure Rust, feature-gated)
oxistore-core = { version = "0.2.0", default-features = false }
oxistore-kv-fjall = { version = "0.2.0", default-features = false }

# Mobile / Android
jni = { version = "0.22", default-features = false }

# ML GPU/compute backends (optional, feature-gated)
libloading = "0.9"
ash = { version = "0.38", default-features = false, features = ["loaded"] }
opencl3 = "0.12"
metal = { version = "0.33", default-features = false, features = ["link"] }
objc = "0.2"

# Database connectors
mysql_async = "0.37"
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "bson-3", "rustls-tls"] }
bson = { version = "3", default-features = false, features = ["compat-3-0-0", "serde"] }
clickhouse = "0.15"
scylla = { version = "1", default-features = false }

# Protobuf types (companion to prost)
prost-types = "0.14"

# Google Cloud (extended)
google-cloud-googleapis = { version = "0.16", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# High priority lints - must fix
unwrap_used = "deny"
panic = "deny"

# Medium priority lints
expect_used = "warn"
missing_errors_doc = "allow"  # Too verbose for now
missing_panics_doc = "allow"

# Allow common patterns in geospatial code
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"  # Too pedantic for backticks
suboptimal_flops = "allow"  # FMA not always better for readability
manual_midpoint = "allow"  # Our implementation is clear
similar_names = "allow"  # x/y, width/height are standard
module_name_repetitions = "allow"  # Common in geospatial APIs

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"


