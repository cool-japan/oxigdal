oxigdal-ml-foundation = { path = "crates/oxigdal-ml-foundation", version = "0.1.7" }
oxigdal-metadata = { path = "crates/oxigdal-metadata", version = "0.1.7" }
oxigdal-sensors = { path = "crates/oxigdal-sensors", version = "0.1.7" }
oxigdal-gpu = { path = "crates/oxigdal-gpu", version = "0.1.7" }
oxigdal-gpu-advanced = { path = "crates/oxigdal-gpu-advanced", version = "0.1.7" }
oxigdal-bench = { path = "crates/oxigdal-bench", version = "0.1.7" }
oxigdal-ws = { path = "crates/oxigdal-ws", version = "0.1.7" }
oxigdal-websocket = { path = "crates/oxigdal-websocket", version = "0.1.7" }
oxigdal-etl = { path = "crates/oxigdal-etl", version = "0.1.7" }
oxigdal-services = { path = "crates/oxigdal-services", version = "0.1.7" }
oxigdal-cache-advanced = { path = "crates/oxigdal-cache-advanced", version = "0.1.7" }
oxigdal-cluster = { path = "crates/oxigdal-cluster", version = "0.1.7" }
