[package]
name = "oxigeo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
oxigeo-geotiff = { path = "../crates/oxigeo-drivers/geotiff" }
oxigeo-jpeg2000 = { path = "../crates/oxigeo-drivers/jpeg2000" }
oxigeo-grib = { path = "../crates/oxigeo-drivers/grib" }
oxigeo-geoparquet = { path = "../crates/oxigeo-drivers/geoparquet" }
oxigeo-shapefile = { path = "../crates/oxigeo-drivers/shapefile" }
oxigeo-flatgeobuf = { path = "../crates/oxigeo-drivers/flatgeobuf" }
oxigeo-zarr = { path = "../crates/oxigeo-drivers/zarr" }
oxigeo-gpkg = { path = "../crates/oxigeo-gpkg" }
oxigeo-mbtiles = { path = "../crates/oxigeo-mbtiles", features = ["sqlite"] }
oxigeo-pmtiles = { path = "../crates/oxigeo-pmtiles" }
oxigeo-copc = { path = "../crates/oxigeo-copc" }

# Prevent this crate from being included in normal workspace builds
[workspace]

[[bin]]
name = "fuzz_geotiff_header"
path = "fuzz_targets/fuzz_geotiff_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jpeg2000_boxes"
path = "fuzz_targets/fuzz_jpeg2000_boxes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_grib2_sections"
path = "fuzz_targets/fuzz_grib2_sections.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lerc_decode"
path = "fuzz_targets/fuzz_lerc_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wkb_decode"
path = "fuzz_targets/fuzz_wkb_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_shapefile_header"
path = "fuzz_targets/fuzz_shapefile_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_flatgeobuf_root"
path = "fuzz_targets/fuzz_flatgeobuf_root.rs"
test = false
doc = false

[[bin]]
name = "fuzz_zarr_metadata"
path = "fuzz_targets/fuzz_zarr_metadata.rs"
test = false
doc = false

[[bin]]
name = "fuzz_gpkg_header"
path = "fuzz_targets/fuzz_gpkg_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mbtiles_header"
path = "fuzz_targets/fuzz_mbtiles_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pmtiles_header"
path = "fuzz_targets/fuzz_pmtiles_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_copc_header"
path = "fuzz_targets/fuzz_copc_header.rs"
test = false
doc = false
