[package]
name = "oxigdal-security"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-security"
rust-version.workspace = true
readme = "README.md"
keywords = ["security", "encryption", "access-control", "compliance", "audit"]
categories = ["cryptography", "authentication", "science"]
description = "Enterprise security features for OxiGDAL: encryption, access control, compliance"

[features]
# Default now includes `tls` — the oxitls stack is 100% Pure Rust (no ring/C/ASM).
default = ["tls"]
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:oxitls-core",
    "dep:oxitls-adapter-rustls-rustcrypto",
    "dep:oxitls-webpki-roots",
]

[dependencies]
# Crypto primitives — Pure Rust only
pbkdf2.workspace = true
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true

# TLS support — pure-Rust via OxiTLS + rustls (feature-gated)
# rustls is still needed for the public Arc<ClientConfig>/Arc<ServerConfig> return types.
rustls = { workspace = true, features = ["std", "tls12"], optional = true }
rustls-pemfile = { workspace = true, optional = true }
oxitls-core = { workspace = true, optional = true }
oxitls-adapter-rustls-rustcrypto = { workspace = true, optional = true }
oxitls-webpki-roots = { workspace = true, optional = true }

# UUID and time
uuid = { workspace = true }
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Data structures
dashmap.workspace = true
petgraph.workspace = true

# Compression
oxiarc-zstd = { workspace = true }

# Random — use scirs2-core for RNG (SciRS2 Policy: no direct rand/rand_distr)
scirs2-core = { workspace = true, features = ["random"] }
getrandom.workspace = true

# Encoding
base64.workspace = true

# Pattern matching
regex.workspace = true

# Concurrency
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "security_bench"
harness = false

[lib]
doctest = false
