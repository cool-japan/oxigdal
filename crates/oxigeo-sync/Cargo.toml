[package]
name = "oxigeo-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-sync"
readme = "README.md"
description = "Multi-device synchronization with CRDTs, vector clocks, and operational transformation for OxiGeo"
keywords = ["science", "sync", "crdt", "distributed", "collaboration"]
categories = ["science", "data-structures", "network-programming"]

[dependencies]
# Core dependencies
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Serialization
blake3 = { workspace = true }

# Additional utilities
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = []

[lib]
doctest = false

[[bench]]
name = "sync_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
