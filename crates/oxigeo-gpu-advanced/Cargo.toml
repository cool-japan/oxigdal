[package]
name = "oxigeo-gpu-advanced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-gpu-advanced"
readme = "README.md"
description = "Advanced GPU computing with multi-GPU support, memory pooling, and shader optimization for OxiGeo"
keywords = ["gis", "gdal", "gpu", "multi-gpu", "wgpu"]
categories = ["science", "graphics", "rendering", "concurrency"]

[features]
default = ["auto-backend"]
# Auto-select platform backend
auto-backend = []
# GPU backends
vulkan = ["wgpu/vulkan"]
metal = ["wgpu/metal"]
dx12 = ["wgpu/dx12"]
webgpu = ["wgpu/webgpu"]
# All backends (except WebGPU for native)
all-native-backends = ["vulkan", "metal", "dx12"]
# Advanced features
shader-optimization = []
memory-defrag = []
ml-inference = []
# Optional C allocator (libmimalloc-sys is a C library; off by default)
alloc-mimalloc = ["dep:mimalloc"]

[dependencies]
# Workspace dependencies
oxigeo-core = { workspace = true, default-features = true }
oxigeo-gpu = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
dashmap = { workspace = true }
lru = { workspace = true }

# GPU dependencies (latest versions)
wgpu = { workspace = true }
pollster.workspace = true
encase.workspace = true
naga = { workspace = true }

# Concurrency and synchronization
parking_lot.workspace = true
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true

# Math
glam = { workspace = true }

# Memory tracking (optional — libmimalloc-sys is C FFI; enable with feature "alloc-mimalloc")
mimalloc = { workspace = true, default-features = false, optional = true }

# Hash and crypto for shader caching
blake3.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true }
proptest = { workspace = true }
approx = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "gpu_advanced_bench"
harness = false

[[bench]]
name = "multi_gpu_bench"
harness = false

[[bench]]
name = "memory_pool_bench"
harness = false

[[bench]]
name = "advanced_kernels_bench"
harness = false

[lints]
workspace = true

# NOTE: docs.rs has no GPU hardware/drivers, so we build with the pure
# wgpu/WGSL backend surface only. `alloc-mimalloc` is excluded because it
# pulls libmimalloc-sys, a bundled C allocator (not Pure Rust).
[package.metadata.docs.rs]
features = [
    "auto-backend", "vulkan", "metal", "dx12", "webgpu",
    "all-native-backends", "shader-optimization", "memory-defrag", "ml-inference",
]
rustdoc-args = ["--cfg", "docsrs"]
