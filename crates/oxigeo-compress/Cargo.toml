[package]
name = "oxigeo-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-compress"
readme = "README.md"
description = "Advanced compression codecs and auto-selection for geospatial data"
keywords = ["compression", "science", "codec", "zstd", "lz4"]
categories = ["compression", "science", "encoding"]

[dependencies]
# Workspace dependencies
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
byteorder = { workspace = true }
rayon = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# Compression libraries
oxiarc-lz4 = { workspace = true }
oxiarc-zstd = { workspace = true }
oxiarc-deflate = { workspace = true }
oxiarc-archive = { workspace = true }
oxiarc-brotli = { workspace = true }
oxiarc-snappy = { workspace = true }

# Additional dependencies
# `ahash` is target-split below: its default `runtime-rng` feature pulls
# `getrandom`, which refuses to build for `wasm32-unknown-unknown` unless its
# JS backend is opted into. See the two `[target...]` sections.

# Everywhere `getrandom` has a real OS entropy source, keep ahash's default
# `runtime-rng`: the hash keys are drawn per process, so the input to
# `DictionaryEncoder::compress` — which is attacker-controlled in a server —
# cannot be crafted to collide in the dictionary map.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash = { workspace = true, features = ["std", "runtime-rng"] }

# On wasm32 there is no OS entropy source, and `getrandom`'s only option is its
# `wasm_js` backend, i.e. a hard dependency on a JavaScript host. This crate is
# a pure-Rust codec library with no other JS coupling, so instead of dragging
# one in, wasm builds swap `runtime-rng` for `compile-time-rng`: `const-random`
# generates the keys on the *host* at build time, keeping ahash's speed and a
# per-build (rather than per-process) key.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ahash = { workspace = true, features = ["std", "compile-time-rng"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["parallel"]
parallel = ["rayon"]
async = ["tokio", "futures", "async-trait"]
all = ["parallel", "async"]

[[bench]]
name = "compression_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
