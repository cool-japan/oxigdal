[package]
name = "oxigeo-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-bench"
readme = "README.md"
description = "Comprehensive performance profiling and benchmarking suite for OxiGeo"
keywords = ["benchmark", "profiling", "performance", "science", "gdal"]
categories = ["development-tools::profiling", "science"]

[dependencies]
# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio = { workspace = true, optional = true }

# Time and statistics
chrono.workspace = true

# Internal oxigeo crates
oxigeo-core = { workspace = true, default-features = true }
oxigeo-algorithms = { workspace = true, optional = true, default-features = true }
oxigeo-geotiff = { workspace = true, optional = true }
oxigeo-geojson = { workspace = true, optional = true }
oxigeo-cloud = { workspace = true, optional = true }
oxigeo-ml = { workspace = true, optional = true }
oxigeo-analytics = { workspace = true, optional = true }

# Benchmarking
criterion.workspace = true

# Profiling (pulls in `backtrace` -> `miniz_oxide`; kept out of default
# features per the Pure Rust Policy -- see the `profiling` feature below).
pprof = { workspace = true, optional = true }

# Parallel processing
rayon.workspace = true

# Statistics and reporting
tinytemplate.workspace = true

# System information
sysinfo.workspace = true

# Temporary files
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# Used only by the DirectIoScenario benchmark scenario to request O_DIRECT
# (Linux) / F_NOCACHE (macOS) uncached I/O. This is a syscall-flag binding,
# not a bundled C library, so it does not violate the Pure-Rust policy.
libc.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
async = ["tokio"]
raster = ["oxigeo-geotiff"]
vector = ["oxigeo-geojson"]
cloud = ["oxigeo-cloud", "async"]
ml = ["oxigeo-ml"]
analytics = ["oxigeo-analytics", "oxigeo-algorithms"]
algorithms = ["oxigeo-algorithms"]
lzw = ["raster", "oxigeo-geotiff?/lzw"]
deflate = ["raster", "oxigeo-geotiff?/deflate"]
zstd = ["raster", "oxigeo-geotiff?/zstd"]
# CPU/flamegraph profiling via `pprof`. Non-default: `pprof` depends on
# `backtrace`, which depends on `miniz_oxide` for compressed debug-info
# sections -- keeping this feature opt-in keeps the default build graph
# Pure-Rust-clean (Pure Rust Policy). Enable explicitly for local profiling:
# `cargo bench -p oxigeo-bench --features profiling`.
profiling = ["dep:pprof"]
full = [
    "async",
    "raster",
    "vector",
    "cloud",
    "ml",
    "analytics",
    "algorithms",
    "lzw",
    "deflate",
    "zstd",
]

[[bench]]
name = "raster_ops"
harness = false
required-features = ["raster"]

[[bench]]
name = "vector_ops"
harness = false
required-features = ["vector"]

[[bench]]
name = "io_ops"
harness = false

[[bench]]
name = "cloud_ops"
harness = false
required-features = ["cloud"]

[[bench]]
name = "ml_inference"
harness = false
required-features = ["ml"]

[[bench]]
name = "bounding_box"
harness = false

[[bench]]
name = "geo_transform"
harness = false

[[bench]]
name = "raster_buffer"
harness = false

[[bench]]
name = "algorithms_bench"
harness = false
required-features = ["algorithms"]

[[bench]]
name = "compression"
harness = false
required-features = ["raster"]

[[bench]]
name = "driver_throughput"
harness = false
required-features = ["raster", "vector"]

[[bench]]
name = "geojson_bench"
harness = false

[[bench]]
name = "geotiff_writer_bench"
harness = false
required-features = ["raster"]

[[bench]]
name = "tile_bench"
harness = false

[[bench]]
name = "tiff_parsing"
harness = false
required-features = ["raster"]

[[bench]]
name = "gdal_comparison"
harness = false
required-features = ["algorithms", "raster"]

[lints]
workspace = true

# `all-features = true` would also turn on `profiling`, which pulls `pprof` ->
# `backtrace` -> `miniz_oxide` -- see the Pure Rust Policy note on the
# `profiling` feature above (it is deliberately left out of the `full` bundle
# for the same reason). The list below mirrors `full`'s contents so the docs
# build stays on the same Pure-Rust closure as the default feature set
# (mirrors the pattern in oxigeo-cloud-enhanced).
[package.metadata.docs.rs]
features = [
    "async", "raster", "vector", "cloud", "ml",
    "analytics", "algorithms", "lzw", "deflate", "zstd",
]
rustdoc-args = ["--cfg", "docsrs"]
