[package]
name = "oxigeo-etl"
description = "Streaming ETL framework for continuous geospatial data processing with OxiGeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-etl"
readme = "README.md"
keywords = ["etl", "streaming", "science", "pipeline", "data-processing"]
categories = ["science", "asynchronous", "data-structures"]

[features]
default = ["std"]
std = ["thiserror/std", "serde/std"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
stac = ["dep:reqwest"]
http = ["dep:reqwest"]
scheduler = ["dep:cron"]
all = ["postgres", "s3", "stac", "http", "scheduler"]

[dependencies]
# Core dependencies
oxigeo-core = { workspace = true, default-features = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Geospatial reprojection (GeoMapOperator::transform_crs)
# Workspace declares oxigeo-proj without default-features=false, but we mirror the
# oxigeo-cli pattern and enable "std" explicitly since oxigeo-proj is not no_std-clean.
oxigeo-proj = { workspace = true, features = ["std"] }

# Async runtime
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "io-util"] }
futures.workspace = true
async-trait.workspace = true

# Stream processing
dashmap.workspace = true

# Logging
tracing.workspace = true

# Optional: PostgreSQL support
tokio-postgres = { workspace = true, optional = true, features = ["with-serde_json-1"] }
deadpool-postgres = { workspace = true, optional = true }

# Optional: S3 support
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }

# Optional: HTTP/STAC support
reqwest = { workspace = true, optional = true }

# Optional: Scheduler support
cron = { workspace = true, optional = true }

# Utilities
chrono.workspace = true
regex.workspace = true
oxiarc-archive = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true

[lints]
workspace = true

# NOTE: `s3`/`stac`/`http` (aws-lc-sys via reqwest/aws-sdk-s3's rustls default
# provider) are not Pure Rust. `postgres` and `scheduler` stay on a pure-Rust
# dependency closure. The `kafka` feature was removed in 0.2.1 along with the
# retired `oxigeo-kafka` crate (rdkafka-sys required a C toolchain).
[package.metadata.docs.rs]
features = ["std", "postgres", "scheduler"]
rustdoc-args = ["--cfg", "docsrs"]
