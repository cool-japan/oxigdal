[package]
name = "oxigeo-postgis"
description = "PostgreSQL/PostGIS integration for OxiGeo - Spatial database workflows with connection pooling and async operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-postgis"
readme = "README.md"
keywords = ["gdal", "science", "gis", "postgis", "postgresql"]
categories = ["science", "database"]

[features]
default = []
rustls = ["dep:tokio-postgres-rustls"]

[dependencies]
# Core dependencies
oxigeo-core = { workspace = true, default-features = true }
thiserror.workspace = true
serde_json.workspace = true
bytes.workspace = true
byteorder.workspace = true

# PostgreSQL and connection pooling
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
postgres-types = { workspace = true, features = ["with-serde_json-1"] }
deadpool-postgres.workspace = true

# SSL/TLS support
tokio-postgres-rustls = { workspace = true, optional = true }

# Async runtime
tokio.workspace = true
futures.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# `all-features = true` here only enables the single optional feature
# `rustls` (`dep:tokio-postgres-rustls`), a pure-Rust TLS integration with
# no C/C++ FFI (`ring`/`aws-lc-sys` transitives are not required — the crate
# does not pull them in). Verified 2026-07-17 with `cargo doc -p
# oxigeo-postgis --no-deps --target x86_64-unknown-linux-gnu --all-features`
# (docs.rs's default target) — builds clean, no non-Linux/FFI deps resolved.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
