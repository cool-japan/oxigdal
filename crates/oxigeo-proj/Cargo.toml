[package]
name = "oxigeo-proj"
description = "Pure Rust coordinate transformation and projection support for OxiGeo - EPSG database and CRS operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-proj"
readme = "README.md"
keywords = ["gdal", "projection", "crs", "coordinate", "transform"]
categories = ["science", "algorithms"]

# Architecture: OxiProj (pure Rust, always active) is the default engine.
# proj4rs is retained as an optional fallback via the `proj4rs-compat` feature for backward-compat error conversion.
# proj-sys: Optional C bindings to system PROJ library (feature-gated, not in default closure).
[features]
default = ["std"]
# NOTE: `oxiproj/epsg` is intentionally NOT enabled here. It transitively pulls
# `oxiproj-db`, whose `open_bundled()` uses a tokio runtime + `std::process::id()` +
# `std::env::temp_dir()` + `std::fs`, none of which build on `wasm32-unknown-unknown`.
# oxigeo-proj does not need it: it ships its own pure-Rust embedded EPSG registry
# (`src/epsg/`, `lookup_epsg`) for `Crs::from_epsg`, and transforms route through the
# pure-Rust `oxiproj::Crs::from_proj` + `oxiproj::Transformer::new` (no authority DB).
# The oxiproj-native EPSG/DB path is available opt-in via the `proj-db` feature below.
std = ["thiserror/std", "serde/std", "dep:serde_json", "dep:once_cell", "oxiproj/projjson"]
proj-sys = ["dep:proj"]  # Optional C bindings to PROJ library
# `proj-db` enables oxigeo-proj's own pure-Rust oxisql PROJ.db reader (~7500 EPSG codes)
# and, since it is a native-only opt-in, also the oxiproj-native EPSG registry
# (`oxiproj/epsg` → oxiproj-db). Keep `oxiproj/epsg` here (not in `std`) so the default
# and wasm builds stay free of oxiproj-db/oxisql/tokio.
proj-db = ["dep:oxisql-sqlite-compat", "dep:oxisql-core", "oxiproj/epsg"]  # PROJ.db SQLite reader for ~7500 EPSG codes
# Retained for backward-compatible error conversion; remove in next major version
proj4rs-compat = ["dep:proj4rs"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
num-traits = { workspace = true }
byteorder = { workspace = true }

# std-only dependencies
serde_json = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# Pure Rust projection implementation (std only — proj4rs requires std)
proj4rs = { workspace = true, optional = true }

# OxiProj — Pure-Rust cartographic library (COOLJAPAN)
oxiproj = { workspace = true }
oxiproj-core = { workspace = true }

# Optional C bindings to PROJ library
proj = { workspace = true, optional = true }

# Optional SQLite reader for system PROJ.db
oxisql-sqlite-compat = { workspace = true, optional = true }
oxisql-core = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
oxisql-core = { workspace = true }
oxisql-sqlite-compat = { workspace = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true

# NOTE: `proj-sys` pulls the `proj` crate's C bindings to the system libproj
# library (and transitively libsqlite3-sys) — not Pure Rust and not available
# on docs.rs. `proj-db` uses the pure-Rust oxisql-sqlite-compat (Limbo) engine
# instead and stays in the curated set along with `proj4rs-compat`.
[package.metadata.docs.rs]
features = ["std", "proj-db", "proj4rs-compat"]
rustdoc-args = ["--cfg", "docsrs"]
