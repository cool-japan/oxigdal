[package]
name = "oxigeo-geojson-stream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust streaming GeoJSON reader and writer for OxiGeo"
keywords = ["geospatial", "geojson", "streaming", "vector"]
categories = ["science", "parser-implementations"]

[features]
reproject = ["dep:oxigeo-proj"]
parallel = ["dep:rayon"]

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
regex = { workspace = true }
oxigeo-proj = { workspace = true, optional = true, features = ["std"] }
rayon = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
