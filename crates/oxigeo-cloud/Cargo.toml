[package]
name = "oxigeo-cloud"
description = "Advanced cloud storage backends for OxiGeo - Pure Rust cloud integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-cloud"
readme = "README.md"
keywords = ["network-programming", "storage", "s3", "azure", "gcs"]
categories = ["science", "network-programming", "asynchronous", "caching"]

[features]
default = ["std", "retry", "cache"]
std = ["oxigeo-core/std", "thiserror/std", "serde/std"]
alloc = []

# Cloud providers
s3 = ["async", "dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types"]
azure-blob = ["async", "dep:azure_storage", "dep:azure_storage_blobs", "dep:azure_core", "dep:azure_identity"]
gcs = ["async", "dep:google-cloud-storage", "dep:google-cloud-auth", "dep:google-cloud-gax"]

# Storage backends
http = ["async", "dep:reqwest"]

# Features
async = ["oxigeo-core/async", "dep:tokio", "dep:async-trait", "dep:futures"]
retry = ["async"]
cache = ["dep:lru", "dep:dashmap", "dep:oxiarc-archive", "dep:sha2"]
prefetch = ["async", "cache"]

# Authentication
oauth2 = ["dep:oauth2"]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
thiserror = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# Async runtime
tokio = { workspace = true, optional = true, features = ["io-util", "fs", "time", "sync"] }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# AWS S3
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }

# Azure Blob Storage - Pure Rust SDK
azure_storage = { workspace = true, optional = true }
azure_storage_blobs = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }

# Google Cloud Storage - Pure Rust SDK
google-cloud-storage = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }

# HTTP
reqwest = { workspace = true, optional = true, features = ["stream", "json", "form"] }

# Caching
lru = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

# Crypto for auth
sha2 = { workspace = true, optional = true }

# Compression
oxiarc-archive = { workspace = true, optional = true }

# OAuth2
oauth2 = { workspace = true, optional = true }

# Time handling
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

# NOTE: `s3`/`azure-blob`/`gcs`/`http` all transitively pull aws-lc-sys (C/asm)
# via rustls's default crypto provider (reqwest/aws-config/azure_core/google-cloud-*).
# Curated feature list keeps the docs.rs build on a pure-Rust closure.
[package.metadata.docs.rs]
features = ["std", "alloc", "async", "retry", "cache", "prefetch", "oauth2"]
rustdoc-args = ["--cfg", "docsrs"]
