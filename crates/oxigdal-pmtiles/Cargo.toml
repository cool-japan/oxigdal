[package]
name = "oxigdal-pmtiles"
description = "Pure Rust PMTiles v3 reader for OxiGDAL - single-file tile archive with varint directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-pmtiles"
readme = "README.md"
keywords = ["pmtiles", "tiles", "gis", "protomaps", "geospatial"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["thiserror/std"]
# Enable transparent tile/directory decompression via the OxiARC ecosystem
# (COOLJAPAN Pure Rust Policy — no flate2 / brotli-rs / zstd C bindings).
compression = ["dep:oxiarc-archive"]
# Enable parallel tile encoding via rayon. Requires `compression` to function.
parallel = ["dep:rayon", "compression"]
# Enable HTTP range-request reader backed by oxigdal-streaming cloud HTTP layer.
http-range = ["dep:oxigdal-streaming", "dep:tokio", "oxigdal-streaming/cloud-http"]
# Enable async reader backed by tokio::io::AsyncRead + AsyncSeek.
async = ["dep:tokio"]
# Enable PMTiles → MBTiles export via SQLite (rusqlite bundled).
mbtiles = ["dep:rusqlite"]
# Enable cloud-storage (S3 / GCS / Azure Blob) range-request reader.
cloud-storage = ["dep:url", "dep:reqwest", "dep:tokio"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Pure-Rust compression/decompression (feature-gated): powers
# gzip / brotli / zstd decoding of PMTiles tile payloads and directories.
oxiarc-archive = { workspace = true, optional = true }
# HTTP range-request reader (feature-gated): powered by oxigdal-streaming.
oxigdal-streaming = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
# Parallel tile encoding (feature-gated): data-parallel compression via rayon.
rayon = { workspace = true, optional = true }
# Cloud-storage range-request reader (feature-gated).
url = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
