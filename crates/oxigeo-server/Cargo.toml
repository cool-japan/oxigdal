[package]
name = "oxigeo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-server"
readme = "README.md"
description = "WMS/WMTS tile server for serving OxiGeo rasters over HTTP"
keywords = ["gis", "science", "wms", "wmts", "tile-server"]
categories = ["web-programming::http-server", "science"]

[dependencies]
# Internal dependencies
oxigeo-core = { workspace = true, default-features = true }
oxigeo-algorithms = { workspace = true, default-features = true }
oxigeo-proj.workspace = true
oxigeo-geotiff.workspace = true

# Web framework
axum.workspace = true
tower.workspace = true
# NOTE: tower-http's `compression-*` features are intentionally NOT enabled.
# They pull flate2 -> libz-sys (C) for gzip/deflate and the `brotli` crate, both
# banned by the COOLJAPAN Pure Rust Policy. No `CompressionLayer` is used here;
# if HTTP response compression is added later it must be built on oxiarc-* behind
# an explicit non-default feature.
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
http.workspace = true

# Async runtime
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Image processing
image.workspace = true
png.workspace = true
jpeg-encoder.workspace = true

# Utilities
bytes.workspace = true

# Caching
lru.workspace = true

# Process metrics for the Prometheus /metrics endpoint
sysinfo.workspace = true

# CLI and configuration
clap = { workspace = true, features = ["derive", "env", "cargo"] }

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# XML generation
quick-xml = { workspace = true, features = ["serialize"] }

[dev-dependencies]
# Testing
tempfile.workspace = true
proptest.workspace = true
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true

[[bin]]
name = "oxigeo-server"
path = "src/main.rs"

[lib]
name = "oxigeo_server"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
