[package]
name = "oxigdal-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-3d"
readme = "README.md"
description = "3D visualization, point clouds, and terrain mesh support for OxiGDAL"
keywords = ["gis", "science", "3d", "pointcloud", "mesh"]
categories = ["science", "graphics", "visualization"]

[dependencies]
# Workspace dependencies
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
byteorder.workspace = true
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rayon.workspace = true
num-traits.workspace = true
approx.workspace = true
tracing.workspace = true

# Internal dependencies
oxigdal-core.workspace = true

# Pure-Rust COPC LAZ chunk decoder (feature-gated behind `copc`).
oxigdal-copc = { workspace = true, optional = true }

# Point cloud dependencies
las.workspace = true
laz = { workspace = true, default-features = false }

# Mesh and 3D formats
gltf = { workspace = true, features = ["import"] }
gltf-json.workspace = true

# Geometry and triangulation
delaunator.workspace = true
geo.workspace = true
geo-types.workspace = true

# Spatial indexing
rstar.workspace = true

# Compression (for COPC, EPT)
oxiarc-archive = { workspace = true }
oxiarc-zstd = { workspace = true }

# Base64 encoding for 3D Tiles
base64.workspace = true

# GLB binary support
bytemuck.workspace = true

[dev-dependencies]
tempfile.workspace = true
approx.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# `laz-encoder` exposes the LAZ chunk encoder used to build synthetic COPC
# fixtures for the round-trip decode tests.
# Path-only (no version): dev-dependencies are stripped from the published
# manifest, so a workspace-inherited version requirement here would force
# cargo to resolve `oxigdal-copc = "^0.1.7"` against crates.io during
# `cargo publish`, which fails before that version exists.
oxigdal-copc = { path = "../oxigdal-copc", features = ["laz-encoder"] }

[features]
default = ["las-laz", "mesh", "terrain", "tiles3d"]
las-laz = []
mesh = []
terrain = []
tiles3d = []
async = ["tokio", "futures", "async-trait", "reqwest"]
copc = ["async", "dep:oxigdal-copc"]
ept = ["async"]

# C/Fortran dependencies feature-gated (Pure Rust Policy)
# pdal-support = ["pdal-sys"]  # Future: if needed
# pcl-support = ["pcl-sys"]    # Future: if needed

[lints]
workspace = true

# NOTE: `async`/`copc`/`ept` pull in reqwest -> rustls -> aws-lc-sys (C/asm, not
# Pure Rust). Curated feature list mirrors `default` to keep the docs.rs build
# on a pure-Rust dependency closure; async-gated APIs are cfg'd out of the docs.
[package.metadata.docs.rs]
features = ["las-laz", "mesh", "terrain", "tiles3d"]
rustdoc-args = ["--cfg", "docsrs"]
