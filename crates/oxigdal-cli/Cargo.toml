[package]
name = "oxigdal-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-cli"
readme = "README.md"
description = "Command-line interface for OxiGDAL geospatial operations"
keywords = ["gis", "science", "gdal", "cli", "raster"]
categories = ["command-line-utilities", "science"]

[dependencies]
# Internal dependencies
oxigdal-core.workspace = true
oxigdal-algorithms = { workspace = true, default-features = true }
# Workspace declares oxigdal-proj with default-features = false; oxigdal-proj is
# not no_std-clean, so std must be re-enabled here (mirrors oxigdal-geojson).
oxigdal-proj = { workspace = true, features = ["std"] }
# oxigdal-dev-tools.workspace = true  # Temporarily disabled due to build errors
oxigdal-geotiff.workspace = true
oxigdal-geojson.workspace = true
oxigdal-zarr.workspace = true
oxigdal-flatgeobuf.workspace = true
oxigdal-shapefile.workspace = true
oxigdal-geoparquet.workspace = true
oxigdal-rs3gw.workspace = true
oxigdal-gpkg.workspace = true
oxigdal-jpeg2000.workspace = true
oxigdal-copc.workspace = true
oxigdal-pmtiles.workspace = true
# `sqlite` pulls in the Pure-Rust OxiSQL engine so `info`/`stats` can open
# real on-disk `.mbtiles` archives (SQLite IS the MBTiles container format).
oxigdal-mbtiles = { workspace = true, features = ["sqlite"] }

# CLI dependencies
clap = { workspace = true, features = ["derive", "cargo", "color", "suggestions", "wrap_help"] }
clap_complete.workspace = true
clap_mangen.workspace = true
clap_complete_nushell.workspace = true

# Progress and UI
indicatif = { workspace = true }
console = { workspace = true }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
num-traits.workspace = true
rayon.workspace = true
num_cpus.workspace = true

# Async runtime (for some operations)
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Used only by tests to synthesize a real on-disk `.mbtiles` (SQLite) fixture,
# mirroring the pattern in oxigdal-mbtiles/tests/reader_test.rs.
oxisql-core.workspace = true
oxisql-sqlite-compat.workspace = true

[lints]
workspace = true

[lib]
name = "oxigdal_cli"
path = "src/lib.rs"

[[bin]]
name = "oxigdal"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
