[package]
name = "oxigeo-mobile-enhanced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-mobile-enhanced"
readme = "README.md"
description = "Mobile platform performance optimizations for iOS and Android - battery efficiency, network optimization, and mobile-specific features"
keywords = ["science", "mobile", "optimization", "ios", "android"]
categories = ["science", "embedded", "api-bindings"]

[features]
default = ["std"]
std = []
alloc = []
ios = ["std", "sysinfo", "objc"]
android = ["std", "sysinfo"]
battery-aware = ["std", "sysinfo"]
network-optimization = ["std"]
gesture-support = ["std"]
background-tasks = ["std", "tokio"]

[dependencies]
# Core dependencies
thiserror = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Async runtime (optional for background tasks)
tokio = { workspace = true, optional = true }
futures = { workspace = true }

# Oxigeo crates
oxigeo-core = { workspace = true, default-features = true }

# System information for battery/performance/memory introspection
sysinfo = { workspace = true, optional = true }

# Platform syscall bindings: iOS (sysctl) / Android (system properties) introspection,
# and `statvfs` for real on-device free/total storage queries (see `storage::MobileStorage`).
# Pure-Rust ABI bindings (no C library is linked); the iOS/Android-specific calls are
# gated behind target_os cfgs, and the storage `statvfs` path is gated behind `cfg(unix)`.
# Unconditional (not feature-gated) because `storage::MobileStorage::storage_info` needs a
# real implementation regardless of which optional feature set is enabled.
libc = { workspace = true }

# Objective-C runtime bindings (msg_send!) used to query real iOS device state
# (e.g. `NSProcessInfo.isLowPowerModeEnabled`) that has no `sysctl` equivalent.
# Only referenced under `#[cfg(target_os = "ios")]`; not linked/used on other platforms.
objc = { workspace = true, optional = true }

# Utilities
lru = { workspace = true }
parking_lot = { workspace = true }

# Compression for network efficiency
oxiarc-deflate = { workspace = true }
oxiarc-zstd = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

# Benchmarks will be added later
# [[bench]]
# name = "battery_bench"
# harness = false
#
# [[bench]]
# name = "network_bench"
# harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
