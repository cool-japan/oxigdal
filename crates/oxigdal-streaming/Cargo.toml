[package]
name = "oxigdal-streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-streaming"
readme = "README.md"
description = "Real-time data processing and streaming pipelines for OxiGDAL"
keywords = ["science", "streaming", "real-time", "pipelines", "gis"]
categories = ["science", "asynchronous", "data-structures"]

[dependencies]
# Core dependencies (always available)
oxigdal-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
oxicode = { workspace = true }

# Raster driver (GeoTIFF) - optional, enables raster streaming
oxigdal-geotiff = { workspace = true, optional = true }

# std-only dependencies
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
byteorder = { workspace = true, optional = true }
ahash = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# State backend (OxiStore LSM via fjall) - Pure Rust, feature-gated
oxistore-core = { workspace = true, optional = true }
oxistore-kv-fjall = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
approx = { workspace = true }

[features]
default = ["std", "raster-streaming"]

# Base std feature: enables all async/IO modules that only need the standard
# Rust library.  Does NOT enable raster-streaming (oxigdal-geotiff) to allow
# leaner builds (e.g., tile-http) that don't need the raster driver chain.
std = [
    "oxigdal-core/std",
    "thiserror/std",
    "serde/std",
    "dep:serde_json",
    "dep:tokio",
    "dep:futures",
    "dep:async-trait",
    "dep:arrow",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-buffer",
    "dep:chrono",
    "dep:parking_lot",
    "dep:crossbeam",
    "dep:crossbeam-channel",
    "dep:dashmap",
    "dep:lru",
    "dep:tracing",
    "dep:bytes",
    "dep:ahash",
    "dep:byteorder",
    "dep:num-traits",
]

# GeoTIFF / raster streaming support (requires oxigdal-geotiff).
# Automatically enabled by the `std` default feature via the default member
# list.  Can be disabled with --no-default-features when only tile-http is
# needed.
raster-streaming = [
    "std",
    "dep:oxigdal-geotiff",
    "oxigdal-geotiff/std",
]

# HTTP tile fetching via reqwest.  Enables XyzProtocol::get_tile to actually
# perform HTTP GET requests instead of returning a placeholder empty body.
tile-http = [
    "std",
    "dep:reqwest",
]

# Real HTTP transport for cloud object-store operations (HttpObjectStore).
# Uses reqwest for async range GET, full GET, and HEAD requests with retry.
cloud-http = [
    "std",
    "dep:reqwest",
]

# LSM key-value state backend (OxiStore + fjall, Pure Rust). Opt-in, non-default.
kv-store = ["dep:oxistore-core", "dep:oxistore-kv-fjall"]

[lib]
doctest = false

[[bench]]
name = "streaming_bench"
harness = false

[lints]
workspace = true

# NOTE: `tile-http` and `cloud-http` both pull reqwest -> rustls -> aws-lc-sys
# (C/asm). `raster-streaming` and `kv-store` (OxiStore/fjall) stay Pure Rust.
[package.metadata.docs.rs]
features = ["std", "raster-streaming", "kv-store"]
rustdoc-args = ["--cfg", "docsrs"]
