[package]
name = "oxigeo-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-query"
readme = "README.md"
keywords = ["science", "query", "sql", "optimization", "gis"]
categories = ["database", "parser-implementations", "data-structures"]
description = "SQL-like query language and cost-based optimizer for geospatial data"

[dependencies]
# Core dependencies
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytes.workspace = true

# Async
# NOTE: tokio is intentionally NOT a normal dependency. No production code in
# this crate uses tokio directly (only `#[tokio::test]` in unit/integration
# tests), and tokio's `full` feature does not build on
# wasm32-unknown-unknown. Keeping it as a dev-dependency lets native tests run
# while leaving the compiled dependency graph wasm32-consumable.
async-trait.workspace = true

# Query parsing
sqlparser.workspace = true

# Concurrency
dashmap.workspace = true
parking_lot.workspace = true
# rayon powers the optional `parallel` module (k-way merge / parallel sort).
# It requires OS threads and is not viable on wasm32-unknown-unknown, so it is
# gated behind the default-on `parallel` feature.
rayon = { workspace = true, optional = true }

# Internal dependencies
oxigeo-core = { workspace = true, default-features = true }

# Utilities
blake3.workspace = true

# Data structures
geo-types.workspace = true
geo.workspace = true
wkt = { workspace = true }

[features]
default = ["parallel"]
# Parallel query execution (k-way merge, parallel sort) via rayon. Disable with
# `default-features = false` for wasm32 / single-threaded consumers.
parallel = ["dep:rayon"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
approx.workspace = true
# tokio is dev-only: needed for `#[tokio::test]` and async benches.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "query_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
