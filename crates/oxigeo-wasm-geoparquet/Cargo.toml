[package]
name = "oxigeo-wasm-geoparquet"
description = "WebAssembly bindings for querying remote GeoParquet files with predicate pushdown over HTTP range requests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-wasm-geoparquet"
readme = "README.md"
keywords = ["wasm", "geoparquet", "parquet", "geospatial", "browser"]
categories = ["wasm", "science", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
# Pushdown planning + execution (snappy = parquet/snap, pure Rust)
oxigeo-geoparquet = { workspace = true, features = ["snappy"] }
# GeoJSON writer for query output
oxigeo-geojson-stream = { workspace = true }
parquet = { workspace = true, default-features = false, features = ["arrow"] }
arrow-array = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# WHERE-clause parsing for attribute filters
sqlparser = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }
console_error_panic_hook = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
