[package]
name = "oxigdal-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-bench"
readme = "README.md"
description = "Comprehensive performance profiling and benchmarking suite for OxiGDAL"
keywords = ["benchmark", "profiling", "performance", "science", "gdal"]
categories = ["development-tools::profiling", "science"]

[dependencies]
# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async runtime
tokio = { workspace = true, optional = true }

# Time and statistics
chrono.workspace = true

# Internal oxigdal crates
oxigdal-core.workspace = true
oxigdal-algorithms = { workspace = true, optional = true, default-features = true }
oxigdal-geotiff = { workspace = true, optional = true }
oxigdal-geojson = { workspace = true, optional = true }
oxigdal-cloud = { workspace = true, optional = true }
oxigdal-ml = { workspace = true, optional = true }
oxigdal-analytics = { workspace = true, optional = true }

# Benchmarking
criterion.workspace = true

# Profiling
pprof = { workspace = true }

# Parallel processing
rayon.workspace = true

# Statistics and reporting
tinytemplate.workspace = true
num-traits.workspace = true

# System information
sysinfo.workspace = true

# Temporary files
tempfile.workspace = true

# Logging
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Used only by the DirectIoScenario benchmark scenario to request O_DIRECT
# (Linux) / F_NOCACHE (macOS) uncached I/O. This is a syscall-flag binding,
# not a bundled C library, so it does not violate the Pure-Rust policy.
libc.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
default = []
async = ["tokio"]
raster = ["oxigdal-geotiff"]
vector = ["oxigdal-geojson"]
cloud = ["oxigdal-cloud", "async"]
ml = ["oxigdal-ml"]
analytics = ["oxigdal-analytics", "oxigdal-algorithms"]
algorithms = ["oxigdal-algorithms"]
lzw = ["raster", "oxigdal-geotiff?/lzw"]
deflate = ["raster", "oxigdal-geotiff?/deflate"]
zstd = ["raster", "oxigdal-geotiff?/zstd"]
full = [
    "async",
    "raster",
    "vector",
    "cloud",
    "ml",
    "analytics",
    "algorithms",
    "lzw",
    "deflate",
    "zstd",
]

[[bench]]
name = "raster_ops"
harness = false
required-features = ["raster"]

[[bench]]
name = "vector_ops"
harness = false
required-features = ["vector"]

[[bench]]
name = "io_ops"
harness = false

[[bench]]
name = "cloud_ops"
harness = false
required-features = ["cloud"]

[[bench]]
name = "ml_inference"
harness = false
required-features = ["ml"]

[[bench]]
name = "bounding_box"
harness = false

[[bench]]
name = "geo_transform"
harness = false

[[bench]]
name = "raster_buffer"
harness = false

[[bench]]
name = "algorithms_bench"
harness = false
required-features = ["algorithms"]

[[bench]]
name = "compression"
harness = false
required-features = ["raster"]

[[bench]]
name = "driver_throughput"
harness = false
required-features = ["raster", "vector"]

[[bench]]
name = "geojson_bench"
harness = false

[[bench]]
name = "geotiff_writer_bench"
harness = false
required-features = ["raster"]

[[bench]]
name = "tile_bench"
harness = false

[[bench]]
name = "tiff_parsing"
harness = false
required-features = ["raster"]

[[bench]]
name = "gdal_comparison"
harness = false
required-features = ["algorithms", "raster"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
