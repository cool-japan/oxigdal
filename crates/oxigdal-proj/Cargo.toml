[package]
name = "oxigdal-proj"
description = "Pure Rust coordinate transformation and projection support for OxiGDAL - EPSG database and CRS operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-proj"
readme = "README.md"
keywords = ["gdal", "projection", "crs", "coordinate", "transform"]
categories = ["science", "algorithms"]

[features]
default = ["std"]
std = ["thiserror/std", "serde/std", "dep:serde_json", "dep:once_cell", "dep:proj4rs"]
proj-sys = ["dep:proj"]  # Optional C bindings to PROJ library
proj-db = ["dep:oxisql-sqlite-compat", "dep:oxisql-core"]  # Enable PROJ.db SQLite reader for ~7500 EPSG codes

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
num-traits = { workspace = true }
byteorder = { workspace = true }

# std-only dependencies
serde_json = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

# Pure Rust projection implementation (std only — proj4rs requires std)
proj4rs = { workspace = true, optional = true }

# Optional C bindings to PROJ library
proj = { workspace = true, optional = true }

# Optional SQLite reader for system PROJ.db
oxisql-sqlite-compat = { workspace = true, optional = true }
oxisql-core = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
oxisql-core = { workspace = true }
oxisql-sqlite-compat = { workspace = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
