[package]
name = "oxigeo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-cli"
readme = "README.md"
description = "Command-line interface for OxiGeo geospatial operations"
keywords = ["gis", "science", "gdal", "cli", "raster"]
categories = ["command-line-utilities", "science"]

[dependencies]
# Internal dependencies
oxigeo-core = { workspace = true, default-features = true }
oxigeo-algorithms = { workspace = true, default-features = true }
# Workspace declares oxigeo-proj with default-features = false; oxigeo-proj is
# not no_std-clean, so std must be re-enabled here (mirrors oxigeo-geojson).
oxigeo-proj = { workspace = true, features = ["std"] }
# oxigeo-dev-tools.workspace = true  # Temporarily disabled due to build errors
oxigeo-geotiff.workspace = true
oxigeo-geojson.workspace = true
oxigeo-zarr.workspace = true
oxigeo-flatgeobuf.workspace = true
oxigeo-shapefile.workspace = true
oxigeo-geoparquet.workspace = true
oxigeo-rs3gw.workspace = true
oxigeo-gpkg.workspace = true
oxigeo-jpeg2000.workspace = true
oxigeo-copc.workspace = true
oxigeo-pmtiles.workspace = true
# `sqlite` pulls in the Pure-Rust OxiSQL engine so `info`/`stats` can open
# real on-disk `.mbtiles` archives (SQLite IS the MBTiles container format).
oxigeo-mbtiles = { workspace = true, features = ["sqlite"] }

# CLI dependencies
clap = { workspace = true, features = ["derive", "cargo", "color", "suggestions", "wrap_help"] }
clap_complete.workspace = true
clap_mangen.workspace = true
clap_complete_nushell.workspace = true

# Progress and UI
indicatif = { workspace = true }
console = { workspace = true }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
rayon.workspace = true
num_cpus.workspace = true

# Async runtime (for some operations)
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Used only by tests to synthesize a real on-disk `.mbtiles` (SQLite) fixture,
# mirroring the pattern in oxigeo-mbtiles/tests/reader_test.rs.
oxisql-core.workspace = true
oxisql-sqlite-compat.workspace = true

[lints]
workspace = true

[lib]
name = "oxigeo_cli"
path = "src/lib.rs"

[[bin]]
name = "oxigeo"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
