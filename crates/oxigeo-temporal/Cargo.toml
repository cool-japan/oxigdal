[package]
name = "oxigeo-temporal"
description = "Multi-temporal raster analysis for OxiGeo - Time series, change detection, phenology, and data cube operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-temporal"
readme = "README.md"
keywords = ["gdal", "science", "timeseries", "temporal", "datacube"]
categories = ["science", "algorithms", "data-structures"]

[features]
default = [
    "std",
    "timeseries",
    "compositing",
    "interpolation",
    "aggregation",
    "change_detection",
    "trend_analysis",
    "phenology",
]
std = ["thiserror/std", "serde/std", "chrono/std"]
alloc = []
timeseries = []
compositing = []
interpolation = []
aggregation = []
change_detection = []
trend_analysis = []
phenology = []
datacube = []
zarr = ["dep:oxigeo-zarr", "oxigeo-zarr?/v3", "oxigeo-zarr?/memory"]
filesystem = ["zarr", "oxigeo-zarr?/filesystem"]
parallel = ["dep:rayon"]
all_temporal = [
    "timeseries",
    "compositing",
    "interpolation",
    "aggregation",
    "change_detection",
    "trend_analysis",
    "phenology",
    "datacube",
    "parallel",
    "zarr",
    "filesystem",
]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
oxigeo-analytics = { workspace = true }
oxigeo-zarr = { workspace = true, optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
approx = { workspace = true }

# Scientific computing - Use SciRS2 ecosystem
# Note: scirs2-core includes ndarray as required dependency
scirs2-core = { workspace = true, features = ["array", "array_stats", "linalg", "random"] }

# Parallelization
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
approx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
