[package]
name = "oxigeo-copc"
description = "Pure Rust COPC (Cloud Optimized Point Cloud) reader for OxiGeo - LAS/LAZ format with spatial index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-copc"
readme = "README.md"
keywords = ["copc", "lidar", "pointcloud", "las", "gis"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["thiserror/std"]
# Exposes LAZ encoder helpers used by round-trip integration tests.  Not
# intended for production use — the encoder is correctness-focused, not
# bitstream-compatible with the reference C++ writer.
laz-encoder = []

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]

[lints]
workspace = true

[[test]]
name = "laz_test"
required-features = ["laz-encoder"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
