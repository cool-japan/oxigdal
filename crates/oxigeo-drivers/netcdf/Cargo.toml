[package]
name = "oxigeo-netcdf"
description = "NetCDF driver for OxiGeo - Pure Rust NetCDF-3 with optional NetCDF-4 support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-netcdf"
readme = "README.md"
keywords = ["netcdf", "scientific", "array", "climate", "gdal"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["oxigeo-core/std", "thiserror/std", "serde/std"]
alloc = []

# Pure Rust NetCDF-3 support (TEMPORARILY DISABLED - netcdf3 v0.6 API migration in progress)
# Re-enable after completing API migration in task #601
netcdf3 = ["dep:netcdf3"]

# NetCDF-4/HDF5 support via C bindings (feature-gated for Pure Rust policy)
# Warning: Requires system libnetcdf and libhdf5 libraries
# DISABLED by default for Pure Rust compliance - enable explicitly if needed
# netcdf4 = ["dep:netcdf"]

# CF conventions support
cf_conventions = []

# Compression support (for netcdf4 only) - disabled along with netcdf4
# compression = ["netcdf4"]

# Async I/O
async = ["oxigeo-core/async", "dep:tokio"]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Pure Rust NetCDF-4 (HDF5) reader/writer atop oxih5 — the real NetCDF-4 backend.
oxinetcdf = { workspace = true }

# Pure Rust NetCDF-3 implementation (optional, netcdf3 v0.6 API)
netcdf3 = { workspace = true, optional = true }

# Pure Rust compression for NetCDF-4
oxiarc-deflate = { workspace = true }

# C-based NetCDF-4/HDF5 implementation (feature-gated, DISABLED for Pure Rust policy)
# netcdf = { version = "0.9", optional = true }

# Async
tokio = { workspace = true, optional = true, features = ["io-util", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
approx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# Used directly in tests to build low-level fixtures (e.g. real HDF5
# sub-groups) that oxinetcdf's higher-level NcFileWriter can't express yet.
oxih5 = { workspace = true }
# Names the `Dataspace` enum (not re-exported by oxih5/oxinetcdf) so tests can
# build padded-attribute fixtures directly.
oxih5-core = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
