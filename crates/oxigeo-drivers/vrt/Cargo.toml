[package]
name = "oxigeo-vrt"
description = "VRT (Virtual Raster) driver for OxiGeo - Pure Rust GDAL reimplementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-vrt"
readme = "README.md"
keywords = ["vrt", "virtual", "raster", "mosaic", "gdal"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["oxigeo-core/std", "thiserror/std"]
async = ["oxigeo-core/async", "dep:tokio"]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
oxigeo-geotiff = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
quick-xml = { workspace = true }
lru = { workspace = true }

# Async
tokio = { workspace = true, optional = true, features = ["io-util", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
