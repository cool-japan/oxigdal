[package]
name = "oxigeo-shapefile"
description = "Shapefile (ESRI) driver for OxiGeo - Pure Rust GDAL reimplementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-shapefile"
readme = "README.md"
keywords = ["shapefile", "gis", "vector", "esri", "gdal"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["oxigeo-core/std", "thiserror/std", "serde/std"]
async = ["oxigeo-core/async", "dep:tokio"]
arrow = ["oxigeo-core/arrow"]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
thiserror = { workspace = true }
serde = { workspace = true }
byteorder = { workspace = true }
tracing = { workspace = true }
encoding_rs = { workspace = true }

# Async
tokio = { workspace = true, optional = true, features = ["io-util", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
