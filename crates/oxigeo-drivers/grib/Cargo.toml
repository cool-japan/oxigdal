[package]
name = "oxigeo-grib"
description = "GRIB1/GRIB2 meteorological data format driver for OxiGeo - Pure Rust implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-grib"
readme = "README.md"
keywords = ["grib", "meteorology", "weather", "forecast", "gdal"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std", "grib1", "grib2", "jpeg2000"]
std = ["oxigeo-core/std", "thiserror/std", "serde/std"]
alloc = []

# GRIB format version support
grib1 = []
grib2 = []

# DRT 5.40 JPEG2000-packed data decoding via the Pure-Rust oxigeo-jpeg2000
# driver. Requires std (the codestream parser uses std::io). When disabled,
# DRT 5.40 messages return a typed error instead of being decoded.
jpeg2000 = ["std", "grib2", "dep:oxigeo-jpeg2000"]

# Advanced features
# Simple packing (always enabled)
# Complex packing for data compression
complex_packing = []

# Async I/O
async = ["oxigeo-core/async", "dep:tokio"]

[dependencies]
oxigeo-core = { workspace = true, default-features = true }
oxigeo-jpeg2000 = { workspace = true, optional = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }

# Async
tokio = { workspace = true, optional = true, features = ["io-util", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
approx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
