[package]
name = "oxigeo-ml"
description = "Machine learning capabilities for OxiGeo - ONNX Runtime integration for geospatial ML workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-ml"
readme = "README.md"
keywords = ["gdal", "science", "algorithms", "onnx", "ml"]
categories = ["science", "graphics"]

[features]
default = ["std"]
std = ["thiserror/std", "serde/std", "oxigeo-core/std"]

# Inference backends
gpu = ["oxionnx/cuda"]  # GPU acceleration via CUDA (TensorRT not supported in oxionnx)
cuda = ["dep:libloading"]  # CUDA backend with dynamic detection
rocm = ["dep:libloading"]  # AMD ROCm backend with dynamic detection
# directml = []  # DirectML not supported in oxionnx (oxionnx uses compile-time feature flags)
vulkan = ["dep:ash"]  # Vulkan compute backend
metal = ["dep:metal", "dep:objc"]  # Apple Metal backend
opencl = ["dep:opencl3"]  # OpenCL backend
webgpu = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]  # WebGPU backend
# TEMPORARY: Commented out due to objc2 API compatibility issues
# CoreML code needs updates for objc2 0.6 breaking changes (alloc, NSArray::from_slice, etc.)
# coreml = ["dep:objc2", "dep:objc2-core-ml", "dep:objc2-foundation"]  # CoreML support for macOS/iOS (feature-gated)
# TEMPORARY: Commented out due to build dependency issues
# tflitec requires Bazel 6.5.0 but modern systems have Bazel 8.x+
# Also violates Pure Rust Policy (C binding)
# tflite = ["dep:tflitec"]  # TensorFlow Lite support (feature-gated)

# Optimization features
quantization = []  # Model quantization support
pruning = []  # Model pruning support
distillation = []  # Knowledge distillation support

# Advanced ML features (Pure Rust - COOLJAPAN compliant)
cloud-removal = ["dep:scirs2-vision"]  # Cloud and shadow removal
model-download = ["dep:reqwest"]
# TEMPORARILY DISABLED: Optional dependency resolution issues with workspace features
# temporal = ["dep:scirs2-series", "dep:oxigeo-ml-foundation", "oxigeo-ml-foundation?/ml", "dep:oxigeo-temporal", "oxigeo-temporal?/timeseries"]  # Temporal modeling (LSTM, forecasting)

[dependencies]
# Core dependencies
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# OxiGeo ecosystem
oxigeo-core = { workspace = true, default-features = true }

# ONNX Runtime - Pure Rust interface (oxionnx replaces ort)
oxionnx = { workspace = true }

# Geometry and GeoJSON
geojson = { workspace = true }
geo-types.workspace = true
# Geometry algorithms (Douglas-Peucker simplification, polygon union) - Pure Rust
geo = { workspace = true }

# Numerical operations — ndarray required directly by ort crate (ONNX Runtime public API uses ndarray types)
ndarray = { workspace = true }

# Random number generation via scirs2-core (SciRS2 Policy: no direct rand usage)
scirs2-core = { workspace = true, features = ["random"] }

# Parallel processing
rayon = { workspace = true }

# Logging
tracing = { workspace = true }

# Progress tracking and system info
indicatif = { workspace = true }
sysinfo = { workspace = true }

# HTTP client for model downloads
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true }

# GPU backend detection (Pure Rust - COOLJAPAN compliant)
libloading = { workspace = true, optional = true }  # Dynamic library loading for CUDA/ROCm detection
ash = { workspace = true, optional = true }        # Vulkan bindings
opencl3 = { workspace = true, optional = true }     # OpenCL bindings

[target.'cfg(target_os = "macos")'.dependencies]
metal = { workspace = true, optional = true }      # Metal framework bindings for macOS
objc = { workspace = true, optional = true }        # Objective-C runtime for Metal

# TensorFlow Lite support (Safe C bindings - TEMPORARILY DISABLED)
# ISSUE: tflitec requires Bazel 6.5.0 but modern systems have Bazel 8.x+, causing build failures
# Also violates Pure Rust Policy - consider migrating to TenfloweRS (pure Rust alternative)
# tflitec = { version = "0.7.0", optional = true }   # TensorFlow Lite C API safe wrapper

# CoreML support (Pure Rust - TEMPORARILY DISABLED)
# ISSUE: objc2 0.6 has breaking API changes (alloc method, NSArray::from_slice signature, etc.)
# CoreML implementation needs updates to work with new objc2 API
# objc2 = { version = "0.6", optional = true }                   # Modern Objective-C 2.0 bindings
# objc2-core-ml = { version = "0.3", optional = true }           # CoreML framework bindings
# objc2-foundation = { version = "0.3", optional = true }        # Foundation framework bindings

# WebGPU support (Pure Rust - COOLJAPAN compliant)
wasm-bindgen = { workspace = true, optional = true }            # WebAssembly JavaScript bindings
web-sys = { workspace = true, optional = true, features = ["Window", "Navigator"] }  # Browser APIs
js-sys = { workspace = true, optional = true }                  # JavaScript types and operations

# SciRS2 subcrates for advanced features (Pure Rust - COOLJAPAN compliant)
# scirs2-core dependency moved to direct ndarray/rand imports due to workspace dependency resolution issues
# scirs2-core = { workspace = true, features = ["random", "array"] }
scirs2-vision = { workspace = true, optional = true }
# TEMPORARILY DISABLED: Part of temporal feature
# scirs2-series = { workspace = true, optional = true }

# OxiGeo ecosystem dependencies for temporal features
# TEMPORARILY DISABLED: Workspace feature dependencies not resolving correctly
# oxigeo-ml-foundation = { workspace = true, optional = true, features = ["ml"] }
# oxigeo-temporal = { workspace = true, optional = true, features = ["timeseries"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
approx = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "ml_benchmark"
harness = false

[lints]
workspace = true

# NOTE: `cuda` (oxionnx/cuda, requires the CUDA toolkit) and `gpu` (which
# enables `cuda`) are excluded because they require a non-Rust toolchain
# docs.rs does not provide. `model-download` is excluded because it pulls
# reqwest -> rustls -> aws-lc-sys (C/asm). `vulkan`/`metal`/`opencl`/`webgpu`/
# `rocm` stay Pure Rust (dynamic-loading bindings only, no build-time C libs).
[package.metadata.docs.rs]
features = [
    "std", "rocm", "vulkan", "metal", "opencl", "webgpu",
    "quantization", "pruning", "distillation", "cloud-removal",
]
rustdoc-args = ["--cfg", "docsrs"]
