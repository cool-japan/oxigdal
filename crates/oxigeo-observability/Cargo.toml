[package]
name = "oxigeo-observability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-observability"
readme = "README.md"
description = "OpenTelemetry-based observability, monitoring, and alerting for OxiGeo"
keywords = ["observability", "opentelemetry", "monitoring", "metrics", "tracing"]
categories = ["development-tools::profiling", "network-programming", "science"]

[dependencies]
# OpenTelemetry core
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { workspace = true }
opentelemetry-otlp = { workspace = true, optional = true }
# opentelemetry-jaeger removed: RUSTSEC-2025-0123 (entire crate unmaintained, patched=[]).
# The `jaeger` feature falls through to stdout exporter (see traces.rs).
# Production Jaeger users should configure an OTLP endpoint with Jaeger's native OTLP support.

# Tracing integration
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Metrics
prometheus.workspace = true

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Time handling
chrono = { workspace = true }

# HTTP client for exporters (optional: only needed for http-exporter feature)
reqwest = { workspace = true, features = ["json"], optional = true }

# Parking lot for better synchronization
parking_lot = { workspace = true }

# URL parsing
url = { workspace = true }

# UUID
uuid = { workspace = true }

# Fast random number generation
fastrand = { workspace = true }

# Hostname
hostname = { workspace = true }

# Regex matching for alert silence/label-match rules
regex = { workspace = true }

# Real disk-space health checks (Disks::new_with_refreshed_list)
sysinfo = { workspace = true }

[features]
default = ["otlp"]
# jaeger feature kept for API compatibility; opentelemetry-jaeger dep removed (RUSTSEC-2025-0123)
jaeger = []
otlp = ["opentelemetry-otlp"]
http-exporter = ["dep:reqwest"]

[dev-dependencies]
tokio-test.workspace = true
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "observability_bench"
harness = false

[lints]
workspace = true

# NOTE: `http-exporter` pulls reqwest -> rustls -> aws-lc-sys (C/asm).
# `otlp` and `jaeger` stay on a pure-Rust dependency closure.
[package.metadata.docs.rs]
features = ["otlp", "jaeger"]
rustdoc-args = ["--cfg", "docsrs"]
