[package]
name = "oxigdal-gpkg"
description = "Pure Rust GeoPackage (GPKG) reader for OxiGDAL - SQLite format parser without C dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigdal-gpkg"
readme = "README.md"
keywords = ["geopackage", "gpkg", "sqlite", "gis", "geospatial"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["thiserror/std"]
reproject = ["dep:oxigdal-proj"]
flatgeobuf-export = ["dep:oxigdal-flatgeobuf", "dep:oxigdal-core"]
mbtiles-export = ["dep:rusqlite"]
change-tracking = ["dep:rusqlite"]
file-locking = ["dep:libc"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
oxigdal-geojson-stream = { workspace = true }
serde_json = { workspace = true }
oxigdal-proj = { workspace = true, optional = true }
oxigdal-flatgeobuf = { workspace = true, optional = true }
oxigdal-core = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
libc = { workspace = true, optional = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
