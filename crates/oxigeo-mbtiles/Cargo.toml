[package]
name = "oxigeo-mbtiles"
description = "Pure Rust MBTiles tile archive reader for OxiGeo - SQLite-based tile pyramid support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigeo-mbtiles"
readme = "README.md"
keywords = ["mbtiles", "tiles", "gis", "mapbox", "geospatial"]
categories = ["science", "parser-implementations", "encoding"]

[features]
default = ["std"]
std = ["thiserror/std"]
# Enable SQLite-backed `.mbtiles` reader.  SQLite IS the MBTiles container
# format, so this opt-in feature pulls in the Pure-Rust OxiSQL engine.
sqlite = ["dep:oxisql-core", "dep:oxisql-sqlite-compat", "dep:tokio"]

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
oxisql-core = { workspace = true, optional = true }
oxisql-sqlite-compat = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
oxisql-core = { workspace = true }
oxisql-sqlite-compat = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
