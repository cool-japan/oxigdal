# OxiGeo Prometheus Configuration
# Metrics collection and monitoring configuration
# Author: COOLJAPAN OU (Team Kitasan)
#
# Only the `oxigeo-server`, `kubernetes-pods`, `prometheus`, and `grafana` jobs
# below scrape something OxiGeo itself exposes: `oxigeo-server` serves real
# Prometheus text-format metrics (oxigeo_version_info, http_requests_total,
# http_request_duration_seconds, cache_hits_total/cache_requests_total,
# tile_generation_total/_failures_total, wms_requests_total, and standard
# process_* metrics -- see crates/oxigeo-server/src/metrics.rs) on
# `ServerConfig::metrics_port` (default 8081) at `/metrics`.
#
# The `postgres` and `node` jobs below are OPTIONAL, external infrastructure
# prerequisites, not something OxiGeo ships or runs itself:
#   - `postgres` only applies if you deploy the optional `oxigeo-postgis`
#     feature against a real PostgreSQL instance -- you must separately run
#     `postgres_exporter` pointed at *that* instance for these metrics to exist.
#   - `node` (`node_exporter`) is a generic host-metrics exporter for whatever
#     machine runs oxigeo-server; it has nothing OxiGeo-specific about it.
# There is no Redis integration anywhere in the OxiGeo codebase (in
# particular, `oxigeo-cache-advanced` does not depend on a Redis client), so
# no `redis_exporter` job is listed here -- add one yourself only if your own
# deployment puts a real Redis instance in front of OxiGeo for some other
# reason. The `nginx` job is likewise commented out below: it only applies if
# your deployment fronts oxigeo-server with nginx.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'oxigeo-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # OxiGeo Server metrics
  - job_name: 'oxigeo-server'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'oxigeo-server:8081'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1'

  # Kubernetes service discovery (if using K8s)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - oxigeo
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # OPTIONAL: PostgreSQL metrics, via a separately-run `postgres_exporter`
  # pointed at your own PostgreSQL instance. Only meaningful if this
  # deployment uses the optional `oxigeo-postgis` feature; OxiGeo does not
  # run or bundle PostgreSQL or postgres_exporter itself.
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
    relabel_configs:
      - target_label: database
        replacement: oxigeo

  # OPTIONAL: generic host-level system metrics via `node_exporter`, for the
  # machine(s) running oxigeo-server. Not OxiGeo-specific.
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'

  # OPTIONAL, disabled by default: only uncomment if this deployment fronts
  # oxigeo-server with nginx and runs `nginx-exporter` against it. Not part
  # of OxiGeo itself.
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets:
  #         - 'nginx-exporter:9113'

# Remote write configuration (optional - for long-term storage)
remote_write:
  # Example: Prometheus remote write to Cortex or Thanos
  # - url: http://cortex:9009/api/prom/push
  #   queue_config:
  #     capacity: 10000
  #     max_shards: 10
  #     min_shards: 1
  #     max_samples_per_send: 5000
  #     batch_send_deadline: 5s
  #     min_backoff: 30ms
  #     max_backoff: 100ms

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention:
      time: 30d
      size: 50GB
