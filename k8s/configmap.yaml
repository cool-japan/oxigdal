# OxiGeo Kubernetes ConfigMap
# Configuration management for OxiGeo services
# Author: COOLJAPAN OU (Team Kitasan)

apiVersion: v1
kind: ConfigMap
metadata:
  name: oxigeo-config
  namespace: oxigeo
  labels:
    app.kubernetes.io/name: oxigeo
    app.kubernetes.io/component: config
data:
  # Server configuration.
  #
  # Field/table names here MUST match `crates/oxigeo-server::config::Config` exactly - every
  # struct in that module derives `#[serde(deny_unknown_fields)]`, so a stale or mistyped key
  # makes the server refuse to start (loudly) rather than silently ignoring it. There is no
  # top-level [tile], [cors], or [logging] table: tile settings live per-layer under
  # [[layers]], CORS lives under [server], and log verbosity is controlled by the RUST_LOG
  # env var below (see crates/oxigeo-server/src/main.rs), not a config file field.
  server.toml: |
    [server]
    host = "0.0.0.0"
    port = 8080
    workers = 4
    enable_cors = true
    cors_origins = ["*"]
    # Prometheus /metrics endpoint - scraped via the `metrics` container/service port and the
    # prometheus.io/* annotations on this Deployment (see k8s/deployment.yaml).
    metrics_enabled = true
    metrics_port = 8081

    [cache]
    memory_size_mb = 1024
    ttl_seconds = 3600
    enable_stats = true
    compression = false

    [metadata]
    title = "OxiGeo Tile Server"
    abstract_ = "WMS/WMTS tile server powered by OxiGeo"

  # Environment configuration
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"
  OXIGEO_DATA_DIR: "/data"
  OXIGEO_CACHE_DIR: "/cache"
  OXIGEO_HOST: "0.0.0.0"
  OXIGEO_PORT: "8080"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: oxigeo
  labels:
    app.kubernetes.io/name: oxigeo
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript
                   application/json application/javascript application/xml+rss
                   application/rss+xml application/atom+xml image/svg+xml;

        upstream oxigeo_backend {
            least_conn;
            server oxigeo-server:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            location / {
                proxy_pass http://oxigeo_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_buffering off;
                proxy_request_buffering off;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            location /health {
                proxy_pass http://oxigeo_backend/health;
                access_log off;
            }

            location /metrics {
                proxy_pass http://oxigeo_backend:8081/metrics;
                access_log off;
            }
        }
    }
