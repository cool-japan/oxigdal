# OxiGeo Render Configuration
# Configuration for Render platform deployment
# Author: COOLJAPAN OU (Team Kitasan)

services:
  # OxiGeo Server
  - type: web
    name: oxigeo-server
    env: docker
    dockerfilePath: ./docker/Dockerfile.server
    region: oregon
    plan: standard
    numInstances: 2

    healthCheckPath: /health

    envVars:
      - key: RUST_LOG
        value: info
      - key: RUST_BACKTRACE
        value: "1"
      - key: OXIGEO_HOST
        value: "0.0.0.0"
      - key: OXIGEO_PORT
        value: "8080"
      - key: OXIGEO_DATA_DIR
        value: /data
      - key: OXIGEO_CACHE_DIR
        value: /cache
      - key: POSTGRES_HOST
        fromDatabase:
          name: oxigeo-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: oxigeo-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: oxigeo-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: oxigeo-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: oxigeo-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: oxigeo-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: oxigeo-redis
          property: port

    autoDeploy: true

    disk:
      name: oxigeo-data
      mountPath: /data
      sizeGB: 10

  # Redis Cache
  - type: redis
    name: oxigeo-redis
    plan: standard
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# PostgreSQL Database
databases:
  - name: oxigeo-postgres
    databaseName: oxigeo
    user: oxigeo
    plan: standard
    region: oregon
    postgresMajorVersion: 16
