# cargo-audit configuration for oxigeo
#
# This file suppresses known advisories that are transitive dependencies
# and cannot be fixed by the oxigeo project directly.

[advisories]
ignore = [
    # RUSTSEC-2023-0089: `atomic-polyfill` - unsound
    # Transitive dependency via heapless/proj. Cannot be fixed upstream by us.
    "RUSTSEC-2023-0089",

    # RUSTSEC-2025-0057: `fxhash` - use-after-free
    # Transitive dependency via sled/mqtt. Cannot be fixed upstream by us.
    "RUSTSEC-2025-0057",

    # RUSTSEC-2024-0384: `instant` - unmaintained
    # Transitive dependency via sled/azure_core. Cannot be fixed upstream by us.
    "RUSTSEC-2024-0384",

    # RUSTSEC-2022-0081: `json` - unmaintained
    # Transitive dependency via evcxr/jupyter. Cannot be fixed upstream by us.
    "RUSTSEC-2022-0081",

    # RUSTSEC-2024-0436: `paste` - unsound
    # Transitive dependency via nalgebra/scirs2. Cannot be fixed upstream by us.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0134: `rustls-pemfile` - unmaintained
    # Transitive dependency via tonic/rumqttc. Cannot be fixed upstream by us.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0044: `aws-lc-sys` - X.509 Name Constraints Bypass
    # Transitive dependency via the TLS stack. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0044",

    # RUSTSEC-2026-0048: `aws-lc-sys` - CRL Distribution Point Scope Check
    # Transitive dependency via the TLS stack. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0048",

    # RUSTSEC-2026-0049: `rustls-webpki` - CRLs not authoritative for all name types
    # Transitive dependency via the TLS stack. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0049",

    # RUSTSEC-2023-0071: `rsa` - Marvin Attack timing side-channel
    # No fixed version exists. Transitive dependency, cannot be fixed upstream by us.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0097: `rand` 0.7.3 - unsound with custom logger
    # Transitive dependency via azure_core/http-types. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0098: `rustls-webpki` - name constraints for URI names not checked
    # Transitive dependency via AWS SDK. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0098",

    # RUSTSEC-2026-0099: `rustls-webpki` - wildcard cert name constraints bypass
    # Transitive dependency via AWS SDK. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0099",

    # RUSTSEC-2026-0104: `rustls-webpki` - Reachable panic in certificate revocation list parsing
    # Transitive dependency via rumqttc (latest stable 0.25.1 still pins the affected line).
    # Cannot be fixed upstream by us — same pattern as RUSTSEC-2025-0134.
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0173: `proc-macro-error2` - unmaintained
    # Transitive dependency via mysql_async/mysql-common. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0173",

    # RUSTSEC-2026-0174: `http-types` - Authorization::value ASCII invariant violation
    # Transitive dependency via azure_core. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0174",

    # RUSTSEC-2026-0178: `tokio-postgres` - Panic on DataRow with fewer columns
    # Transitive dependency via oxigeo-postgis. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0178",

    # RUSTSEC-2026-0179: `postgres-protocol` - Unbounded SCRAM iteration CPU DoS
    # Transitive dependency via tokio-postgres/oxigeo-postgis. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0179",

    # RUSTSEC-2026-0180: `postgres-protocol` - Panic decoding malformed hstore
    # Transitive dependency via tokio-postgres/oxigeo-postgis. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0180",

    # RUSTSEC-2026-0195: `quick-xml` - unbounded namespace-declaration allocation DoS
    # (memory-exhaustion; not memory-unsafety/RCE). Transitive dependency via
    # pprof/inferno (default dependency of oxigeo-dev-tools/oxigeo-bench) and via
    # azure_core (non-default `azure`/`azure-blob` features of oxigeo-cloud/
    # oxigeo-cloud-enhanced). No quick-xml >=0.41.0 is reachable within current
    # semver constraints on either path. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0195",

    # RUSTSEC-2026-0194: `quick-xml` - quadratic-runtime duplicate-attribute-name
    # check DoS (CPU-exhaustion; not memory-unsafety/RCE). Transitive dependency via
    # pprof/inferno (default dependency of oxigeo-dev-tools/oxigeo-bench) and via
    # azure_core (non-default `azure`/`azure-blob` features of oxigeo-cloud/
    # oxigeo-cloud-enhanced). No quick-xml >=0.41.0 is reachable within current
    # semver constraints on either path. Cannot be fixed upstream by us.
    "RUSTSEC-2026-0194",
]
